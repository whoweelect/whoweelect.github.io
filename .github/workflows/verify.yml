name: Evidence verification preparation
on:
  workflow_dispatch:
  workflow_run:
    workflows: [National accountability research]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: evidence-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 -m unittest test_adapters test_incremental
      - run: python3 -u verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-review
          path: |
            review_queue.json
            quarantine.json
            case_history.json
            verification-report.json
            incremental-report.json
            verification-documents/
          retention-days: 14
          if-no-files-found: error
